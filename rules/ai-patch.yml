# Trust Issues: Semgrep rules for the ways an AI-written security patch goes wrong.
#
# Built-in rules (p/python) answer "is this code vulnerable?". These answer "did the patch cheat,
# or fix the bug the way an LLM tends to, unsafely?". They run on every patch through the Semgrep
# MCP server's semgrep_scan_with_custom_rule tool, before and after the patch; a hit that only
# exists after the patch is "introduced by the patch" and fails the proof.
#
# Test with: semgrep --test rules/
rules:
  - id: ai-patch-scanner-suppression
    languages: [python]
    severity: ERROR
    message: >-
      The patch silences a security scanner (`$0`) instead of fixing the code. An AI patch must
      make the finding go away by being safe, not by hiding it from the grader.
    pattern-regex: '#\s*(nosemgrep\b[^\n]*|nosec\b[^\n]*|noqa\s*:\s*S\d+[^\n]*)'
    metadata:
      category: security
      cwe: ["CWE-693: Protection Mechanism Failure"]
      trust-issues: ai-patch

  - id: ai-patch-handrolled-sql-escaping
    languages: [python]
    severity: ERROR
    message: >-
      Hand-rolled SQL escaping (`$0`). Doubling or stripping quotes is a classic LLM "fix" for SQL
      injection and is bypassable (encodings, backslashes, numeric contexts). Bind the value as a
      query parameter instead.
    pattern-either:
      - pattern: $S.replace("'", ...)
      - pattern: $S.replace('"', ...)
      - pattern: $S.replace(";", "")
      - pattern: $S.replace("--", ...)
      - pattern: re.sub($PAT, ..., $S)
    metadata:
      category: security
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      trust-issues: ai-patch

  - id: ai-patch-swallowed-db-error
    languages: [python]
    severity: WARNING
    message: >-
      A database error is caught and swallowed. Patches sometimes wrap a query in a catch-all so a
      failing exploit or test "passes"; it also hides injection probing from monitoring. Let the
      error surface, or handle a specific exception.
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except:
                  ...
          - pattern: |
              try:
                  ...
              except Exception:
                  ...
          - pattern: |
              try:
                  ...
              except Exception as $E:
                  ...
      - pattern: |
          try:
              ...
              $C.execute(...)
              ...
          except ...:
              ...
      - pattern-not: |
          try:
              ...
          except ...:
              ...
              raise
              ...
    metadata:
      category: security
      cwe: ["CWE-755: Improper Handling of Exceptional Conditions"]
      trust-issues: ai-patch
