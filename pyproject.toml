[project]
name = "trust-issues"
version = "0.1.0"
description = "Finds a vulnerability, patches it, and won't call it fixed until it proves it."
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.8",
    "fastapi>=0.115",
    "flask>=3.0",
    "httpx>=0.27",
    "mcp>=1.9",
    "openai>=1.80",
    "pydantic>=2.7",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
trust = "trust.loop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
